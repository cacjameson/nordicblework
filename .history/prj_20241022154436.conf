# Logging Configuration
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3  # INFO level

# ADC Configuration
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y
CONFIG_ADC_ASYNC=y

# UART Configuration for PuTTY Output
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LOG_BACKEND_ON_UART=y

# Bluetooth Configuration
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="HeartRateMonitor"

# Optional Shell Configuration (for debugging)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# CONFIG_SHELL_PROMPT="nRF5340> "  # Do not set directly

# Do NOT set indirectly configurable options:
# - CONFIG_BT_CONN
# - CONFIG_BT_GATT
# - CONFIG_BT_L2CAP
# - CONFIG_BT_GATT_MAX_MTU
# - CONFIG_BT_GATT_HEART_RATE_SERVICE
# - CONFIG_UART_NRFX_UART
# - CONFIG_UART_0_NAME
# - ADC_TRIGGER_CONVERSION

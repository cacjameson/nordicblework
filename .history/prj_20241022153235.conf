CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3  # INFO level logging

# Enable ADC
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y
CONFIG_ADC_ASYNC=y

# Enable Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_DEVICE_NAME="HeartRateMonitor"
CONFIG_BT_DEVICE_APPEARANCE=0
CONFIG_BT_PRIVACY=y

# Enable GATT
CONFIG_BT_GATT_SERVER=y
CONFIG_BT_GATT_DYNAMIC_DB=y

# Enable necessary Bluetooth services and features
CONFIG_BT_SMP=y
CONFIG_BT_CONN=y
CONFIG_BT_L2CAP=y
CONFIG_BT_GATT_SERVICE_CHANGED=y

# Enable UART for logging (assuming default UART is used)
CONFIG_UART_CONSOLE=y
CONFIG_UART=y
CONFIG_CONSOLE_ON_DEV_NAME="UART_0"

# Optional: Increase buffer sizes if needed
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_EVT_RX_SIZE=251
CONFIG_BT_BUF_CMD_TX_SIZE=251

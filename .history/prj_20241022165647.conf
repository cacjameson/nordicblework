# Logging Configuration
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Logging Backend UART
CONFIG_LOG_BACKEND_UART=y

# ADC Configuration
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y
CONFIG_ADC_ASYNC=y

# UART Configuration for PuTTY Output
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Bluetooth Configuration
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="HeartRateMonitor"

# GATT Service Configuration
CONFIG_BT_GATT_SERVICE_HEART_RATE=y

# Optional Shell Configuration (for debugging)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# Optional: Increase buffer sizes if needed
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_EVT_RX_SIZE=251
CONFIG_BT_BUF_CMD_TX_SIZE=251

# Do NOT set indirectly configurable options:
# - CONFIG_BT_CONN
# - CONFIG_BT_GATT
# - CONFIG_BT_L2CAP
# - CONFIG_BT_GATT_MAX_MTU
# - CONFIG_BT_GATT_HEART_RATE_SERVICE
# - CONFIG_UART_NRFX_UART
# - CONFIG_UART_0_NAME
# - ADC_TRIGGER_CONVERSION
# - SHELL_PROMPT

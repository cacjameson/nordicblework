# Logging Configuration
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y

# Set default log level to INFO
CONFIG_LOG_DEFAULT_LEVEL=4

# Enable ADC logging
CONFIG_ADC_LOG_LEVEL=4

# ADC Configuration
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y
CONFIG_ADC_ASYNC=y

# UART Configuration for PuTTY Output
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Bluetooth Configuration
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="HeartRateMonitor"

# Optional Shell Configuration (for debugging)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# Optional: Increase buffer sizes if needed
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_EVT_RX_SIZE=251
CONFIG_BT_BUF_CMD_TX_SIZE=251

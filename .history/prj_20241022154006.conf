# Logging Configuration
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3  # INFO level logging

# ADC Configuration
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y
CONFIG_ADC_ASYNC=y
CONFIG_ADC_TRIGGER_CONVERSION=y

# UART Configuration for PuTTY Output
CONFIG_UART_CONSOLE=y
# Removed CONFIG_UART_NRFX_UART=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LOG_BACKEND_ON_UART=y
CONFIG_UART_0_NAME="UART_0"

# Bluetooth Configuration
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="HeartRateMonitor"
CONFIG_BT_DEVICE_APPEARANCE=0
CONFIG_BT_GATT=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_SMP=y
CONFIG_BT_L2CAP=y
CONFIG_BT_GATT_SERVICE_CHANGED=y
CONFIG_BT_GATT_MAX_MTU=247

# Enable Heart Rate Service (Standard)
CONFIG_BT_GATT_HEART_RATE_SERVICE=y

# Enable BLE Advertising
# Note: Typically, CONFIG_BT_CENTRAL and CONFIG_BT_OBSERVER are for central and observer roles.
# If your device acts only as a peripheral, you might not need these.
# Uncomment if your application requires central or observer functionalities.
# CONFIG_BT_CENTRAL=y
# CONFIG_BT_OBSERVER=y

# Optional: Increase buffer sizes if needed
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_EVT_RX_SIZE=251
CONFIG_BT_BUF_CMD_TX_SIZE=251

# Enable Shell for Debugging (Optional)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT="nRF5340> "
